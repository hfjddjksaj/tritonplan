name: Deploy planner to GitHub Pages

# The GitHub Pages site is now ONLY the old-site migration page (web/migrate/): it hands the
# plans saved in a browser over to https://tritonplan.cn. It publishes web/dist-migrate, not the
# planner — the planner is served by the tritonplan.cn server.
# The extension is NOT deployed here — it is zipped from extension/dist and uploaded to the
# Chrome Web Store manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:migrate -w @triton/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-migrate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
